<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo">
<meta name="application-name" content="Duo">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="57 quick games for two players on one phone, or against a bot.">
<title>Duo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- MENU -->
<section id="menu">
  <header class="mast">
    <div class="brand"><span class="word">duo</span><span class="tagline"><span id="gcount"></span> games for two</span></div>
    <div class="mast-r"><button id="installBtn" class="pill-btn" type="button" hidden>Install app</button><button id="muteMenu" class="round-btn" type="button" aria-label="Sound"></button></div>
  </header>

  <section class="versus card" aria-label="Players">
    <label class="pl p1"><span class="lab" id="lab1">Player one</span><input id="n1" maxlength="12" spellcheck="false" autocomplete="off"></label>
    <div class="h2h">
      <div class="rec"><span id="r1" class="p1">0</span><span class="dash"></span><span id="r2" class="p2">0</span></div>
      <div class="h2bar"><i id="b1"></i><i id="b2"></i></div>
      <div class="lab" id="nplayed"></div>
    </div>
    <label class="pl p2"><span class="lab" id="lab2">Player two</span><input id="n2" maxlength="12" spellcheck="false" autocomplete="off"></label>
    <div class="opp-wrap"><span class="lab">Play against</span><div id="opp" class="seg" role="group" aria-label="Opponent"></div></div>
  </section>

  <div class="actions">
    <button id="partyBtn" class="act primary" type="button"><span class="t">Party</span><span class="s">5 random games</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button id="randomBtn" class="act" type="button"><span class="t">Shuffle</span><span class="s">any game</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M17 4l3 3-3 3M17 14l3 3-3 3"/></svg></button>
  </div>

  <div class="toolbar">
    <nav id="cats" aria-label="Categories"></nav>
    <input id="search" placeholder="Search" autocomplete="off" spellcheck="false">
  </div>
  <div id="grid"></div>
  <footer id="foot"></footer>
  <div id="iosHint" class="ios-hint" hidden><span>Install Duo: tap <b>Share</b> then <b>Add to Home Screen</b>.</span><button type="button" aria-label="Dismiss">✕</button></div>
</section>

<!-- GAME -->
<section id="game" hidden>
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="pauseBtn" class="fbtn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <div id="overlay" hidden></div>
  </div>
</section>

<script src="js/core.js"></script>
<script src="js/sports.js"></script>
<script src="js/arcade.js"></script>
<script src="js/party.js"></script>
<script src="js/board.js"></script>
<script>Duo.boot();</script>
</body>
</html>
